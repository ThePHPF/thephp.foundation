{% extends 'default' %}

{% block content_wrapper %}
<article itemscope itemtype="https://schema.org/Article">
    {{ include('page-hero.html', { title: page.title, lead: page.subtitle ?? null, eyebrow: page.eyebrow ?? null }) }}

    <div class="container-wide pb-20">
        <div class="section-rule pt-12 max-w-3xl prose-content text-base leading-7" itemprop="text">
            {{ page.blocks.content|raw }}
        </div>
    </div>
</article>
{% endblock content_wrapper %}
