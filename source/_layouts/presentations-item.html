<article class="item-rule relative flex flex-col gap-10 pt-10 lg:flex-row lg:items-start" itemscope
         itemtype="https://schema.org/Event">
    <div class="relative aspect-[16/9] w-full lg:w-1/2 shrink-0 overflow-hidden rounded-xl bg-gray-100">
        <iframe src="{{ iframe }}"
                class="w-full h-full"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen></iframe>
    </div>
    <div>
        <div class="flex flex-wrap items-center gap-2 text-xs text-gray-500">
            <span class="tag-pill">{{ conference }}</span>
            <span itemprop="startDate">{{ date }}</span>
            <span aria-hidden="true">·</span>
            <span itemprop="location">{{ place }}</span>
        </div>
        <div class="relative max-w-xl">
            <h3 class="mt-4 mb-0 text-2xl tracking-tight text-gray-900 font-bold" itemprop="name">
                {{ title }}
            </h3>
            <div class="mt-3 text-base leading-7 text-gray-600" itemprop="description">
                {{ description }}
            </div>
        </div>
        <div class="mt-6 flex flex-wrap gap-x-8 gap-y-4">
            {% for item in team %}
            {% set user = fetch_member_by_code(item) %}
            {% if user %}
            <div class="relative flex items-center gap-x-4" itemprop="performer" itemscope
                 itemtype="https://schema.org/Person">
                <img src="{{ user.image }}" itemprop="image"
                     alt="{{ user.name }}" class="h-10 w-10 rounded-full bg-gray-50 grayscale">
                <div class="text-sm leading-6">
                    <a href="{{ user.url }}" class="text-gray-900 font-semibold no-underline"
                       target="_blank" rel="noopener noreferrer" itemprop="name">{{ user.name }}</a>
                    {% if user.job %}
                    <div class="text-gray-600" itemprop="jobTitle">{{ user.job }}</div>
                    {% endif %}
                </div>
            </div>
            {% endif %}
            {% endfor %}
        </div>
    </div>
</article>
